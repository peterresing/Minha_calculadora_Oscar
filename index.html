<!DOCTYPE html>
<html lang="es"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="container">
        <h1>Calculadora</h1>
        
        <div class="input-group">
            <label for="numero1">Coloca o número ai rapaaaazz:</label>
            <input type="number" id="numero1" placeholder="coloca ai vai">
        </div>
        
        <div class="input-group">
            <label for="numero2">agora o segundo número:</label>
            <input type="number" id="numero2" placeholder="o segundo agora">
        </div>
        
        <div class="botones">
            <button onclick="realizarOperacion(&#39;+&#39;)">+</button>
            <button onclick="realizarOperacion(&#39;-&#39;)">−</button>
            <button onclick="realizarOperacion(&#39;*&#39;)">×</button>
            <button onclick="realizarOperacion(&#39;/&#39;)">÷</button>
        </div>
        
        <div id="resultado" class="resultado" style="display: none;">
            <span id="valorResultado"></span>
        </div>
    </div>
    
<script src="script.js"> 
</body></html>
